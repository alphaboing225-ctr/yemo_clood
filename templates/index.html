<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YemoCloud</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
        }
        .bouton {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .bouton:hover {
            background: #6d28d9;
        }
        .message {
            margin-top: 12px;
            text-align: center;
            color: #000000;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <a href="/connexion"><button class="bouton">Bienvenue sur YemoCloud</button></a>
    <p class="message">
        Bienvenue sur YemoCloud, une base de données pour héberger et gérer vos données en toute simplicité.
    </p>
</body>
</html>
