<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Yemoclood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #e9ecff;
    --encre: #151a4a;
    --texte: #4a4f7a;
    --accent: #3a3aff;
    --accent-fonce: #2626d9;
    --balle: #ff6b57;
    --carte: #ffffff;
    --bord: #d5d9f5;
    --erreur: #c62847;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--texte);
    background:
      radial-gradient(60rem 40rem at 10% -10%, #d3d8ff 0%, transparent 60%),
      var(--fond);
    display: grid;
    place-items: center;
    padding: 1.5rem;
  }
  main {
    width: 100%;
    max-width: 24rem;
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: 1.75rem;
    padding: 2.5rem 2rem 2rem;
    box-shadow: 0 1.5rem 3rem -1.5rem rgba(21, 26, 74, .35);
    text-align: center;
  }

  /* Mot animé */
  .logo {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 4.5rem;
    margin-bottom: 1.25rem;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: 2.6rem;
    letter-spacing: -.03em;
    line-height: 1;
    color: var(--balle);
    cursor: default;
  }
  .logo span {
    display: inline-block;
    transform-origin: 50% 100%;
    animation: rebond 1s cubic-bezier(.3, 0, .4, 1) calc(var(--i) * 80ms) 2 both;
  }
  .logo:hover span {
    animation: rebond 1s cubic-bezier(.3, 0, .4, 1) calc(var(--i) * 80ms) 1 both;
  }
  @keyframes rebond {
    0%   { transform: translateY(-1.1rem) scale(1, 1); }
    45%  { transform: translateY(0) scale(1, 1); animation-timing-function: ease-out; }
    50%  { transform: translateY(0) scale(1.2, .75); }
    58%  { transform: translateY(-.35rem) scale(.95, 1.06); }
    66%  { transform: translateY(0) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.75rem;
    letter-spacing: -.03em;
    line-height: 1.1;
    color: var(--encre);
  }
  .sous-titre {
    margin: .6rem auto 2rem;
    max-width: 18rem;
    line-height: 1.5;
  }
  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .75rem;
    padding: .9rem 1rem;
    font: 500 1rem "DM Sans", system-ui, sans-serif;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .btn-google:hover { background: var(--accent-fonce); }
  .btn-google:active { transform: scale(.98); }
  .btn-google:focus-visible { outline: 3px solid var(--balle); outline-offset: 3px; }
  .btn-google:disabled { opacity: .7; cursor: progress; }
  .pastille {
    display: grid;
    place-items: center;
    width: 1.75rem;
    height: 1.75rem;
    background: #fff;
    border-radius: 50%;
  }
  .pastille svg { width: 1.05rem; height: 1.05rem; }
  #erreur {
    min-height: 1.25rem;
    margin-top: 1rem;
    font-size: .9rem;
    color: var(--erreur);
  }
  .note {
    margin-top: 1.25rem;
    font-size: .85rem;
    color: #7b80a8;
  }
  @media (prefers-reduced-motion: reduce) {
    .logo span, .logo:hover span { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="logo" role="img" aria-label="Yemoclood">
      <span style="--i:0">Y</span><span style="--i:1">e</span><span style="--i:2">m</span><span style="--i:3">o</span><span style="--i:4">c</span><span style="--i:5">l</span><span style="--i:6">o</span><span style="--i:7">o</span><span style="--i:8">d</span>
    </div>

    <h1>Content de vous revoir</h1>
    <p class="sous-titre">C
